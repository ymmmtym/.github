name: Validate Renovate config

on:
  push:
    branches:
      - main
    paths:
      - 'default.json'
      - 'renovate-config.json'
      - 'renovate.json'
      - '.github/renovate.json'
      - '.github/renovate.json5'
      - '.github/workflows/renovate-config-validator.yml'
  pull_request:
    paths:
      - 'default.json'
      - 'renovate-config.json'
      - 'renovate.json'
      - '.github/renovate.json'
      - '.github/renovate.json5'
      - '.github/workflows/renovate-config-validator.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate Renovate config
        run: npx --yes --package renovate -- renovate-config-validator --strict --no-global default.json renovate-config.json
